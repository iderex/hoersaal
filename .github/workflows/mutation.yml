# Mutation testing over the surfaces under the coverage bar, for issue #93.
#
# Coverage says a line ran. This asks whether a test would have noticed if the
# line were wrong: the tool changes one operator at a time, runs the package's
# tests against each change, and counts the changes nothing failed on. A
# survivor is a statement about a specific test that does not test what it
# appears to, and each one is answered by a new test or by a written reason in
# docs/mutation-testing.md rather than by a red gate.
#
# This does not run on a pull request and it does not gate a merge. That is a
# deliberate deviation from how every other check on this board is held, and
# docs/reference-gate-parity.md carries it as one. A score is a measurement of
# the suite rather than a verdict on a change, and the same commit scores
# differently between runs as the tool's per-mutant timeouts fall one way or
# the other, so gating on it would red a change for something already in the
# tree. It runs weekly and on dispatch, over the default branch.
#
# The surfaces are read from the coverage bar rather than listed here, so a
# package added to internal/coverage is mutated without anybody remembering to
# add it, and this file cannot quietly cover fewer than the bar names.
#
# The score is kept per run, as an artefact with the same name on every run,
# and the step after the measurement reads the artefacts of the runs before
# this one and prints them as a table, so a reader of any run sees the trend
# and not a single figure. What the artefact holds outlives the log.
name: Mutation

on:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  # To list and read the artefacts of earlier runs for the trend below, and
  # nothing else: the token writes nothing.
  actions: read

# No cancel-in-progress. A superseded run here has done real work by the time
# the next one starts, and its score is a row in the trend.
concurrency:
  group: ${{ github.workflow }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Five surfaces, each rebuilt and retested once per mutant. The first
    # recorded run took under a minute per surface on a laptop, so this is the
    # bound for a tree several times larger.
    timeout-minutes: 60
    env:
      # The tool is pinned, so what runs is decided here and by the checksum
      # database rather than by whatever is newest on the day.
      GREMLINS: github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0
      # The per-mutant timeout is this many times the package's own test
      # duration. Too small and a slow compile reads as a timeout, which is
      # neither killed nor survived and lowers what the run can say; the first
      # recorded run needed sixty on a laptop to reach zero timeouts.
      TIMEOUT_COEFFICIENT: "60"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the mutation tool
        run: |
          set -euo pipefail
          go install "${GREMLINS}"
          gremlins --version

      - name: Read the surfaces off the coverage bar
        run: |
          set -euo pipefail
          surfaces=$(go run -mod=readonly ./cmd/coverage -surfaces)
          if [ -z "${surfaces}" ]; then
            echo "::error::the coverage bar names no surface, so this run would mutate nothing"
            exit 1
          fi
          echo "surfaces, from internal/coverage:"
          echo "${surfaces}" | sed 's/^/  /'
          {
            echo "SURFACES<<EOF"
            echo "${surfaces}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Mutate each surface
        env:
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          module=$(go list -m)
          mkdir -p report
          printf 'run\tcommit\tsurface\ttotal\tkilled\tlived\tnot_covered\ttimed_out\tefficacy\n' > report/score.tsv
          failed=0
          for s in ${SURFACES}; do
            dir="${s#"${module}"/}"
            name="${dir#internal/}"
            echo "::group::${s}"
            # The tool mutates a copy of the module and runs the package's tests
            # in it; the output file is the machine-readable record of the run.
            if ! (cd "${dir}" && gremlins unleash --timeout-coefficient "${TIMEOUT_COEFFICIENT}" \
                   --output "${GITHUB_WORKSPACE}/report/${name}.json"); then
              echo "::warning::the tool exited non-zero on ${s}; what it wrote is kept and read below"
            fi
            if [ ! -s "report/${name}.json" ]; then
              echo "::error::no record was written for ${s}, so nothing was measured there"
              failed=1
              echo "::endgroup::"
              continue
            fi
            jq -r --arg run "${RUN_NUMBER}" --arg sha "${HEAD_SHA:0:12}" --arg s "${s}" \
              '[$run, $sha, $s, .mutants_total, .mutants_killed, .mutants_lived, .mutants_not_covered,
                ([.files[].mutations[] | select(.status=="TIMED OUT")] | length),
                (.test_efficacy | . * 100 | round / 100)] | @tsv' "report/${name}.json" >> report/score.tsv
            echo "survivors on ${s}:"
            jq -r '.files[] as $f | $f.mutations[] | select(.status=="LIVED") | "  \($f.file_name):\(.line):\(.column) \(.type)"' "report/${name}.json"
            echo "::endgroup::"
          done
          total=$(jq -s '[.[].mutants_total] | add' report/*.json)
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::the run produced zero mutants across every surface, so it measured nothing"
            failed=1
          fi
          echo "this run:"
          column -t -s "$(printf '\t')" report/score.tsv
          exit "${failed}"

      - name: The trend, from the runs before this one
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p trend
          # Every earlier run kept its record under one artefact name. Expired
          # ones are listed and cannot be read, so they are skipped and counted.
          gh api "repos/${REPO}/actions/artifacts?name=mutation-score&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | "\(.workflow_run.id)"' > trend/runs.txt || true
          earlier=0
          skipped=0
          while read -r run; do
            [ -z "${run}" ] && continue
            [ "${run}" = "${RUN_ID}" ] && continue
            if gh run download "${run}" --repo "${REPO}" -n mutation-score -D "trend/${run}" >/dev/null 2>&1 \
               && [ -s "trend/${run}/score.tsv" ]; then
              earlier=$((earlier + 1))
            else
              skipped=$((skipped + 1))
            fi
          done < trend/runs.txt
          {
            echo "## Mutation score, this run and the runs before it"
            echo
            echo "Reporting rather than gating. A row per surface per run; efficacy is killed over killed plus survived, in percent."
            echo
            echo '```'
            {
              head -n 1 report/score.tsv
              for d in trend/*/; do
                [ -f "${d}score.tsv" ] && tail -n +2 "${d}score.tsv"
              done
              tail -n +2 report/score.tsv
            } | sort -t "$(printf '\t')" -k1,1n -k3,3 | column -t -s "$(printf '\t')"
            echo '```'
            echo
            echo "earlier runs read: ${earlier}; listed but unreadable, usually expired: ${skipped}."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-score
          path: report/
          if-no-files-found: error
          retention-days: 90
